<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Мой урок</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1F2A3D">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div id="loadingScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; color:#8A93A0; font-family:'IBM Plex Sans',sans-serif; font-size:0.875rem;">Загружаю…</div>
<div id="notFoundOverlay" style="display:none; min-height:100vh; align-items:center; justify-content:center; padding:1.5rem; text-align:center; color:#5A6472; position:fixed; inset:0; background:#F3F5F1;">Не получилось найти твои данные. Попроси преподавателя проверить код приглашения.<br><br><a href="#" onclick="doLogout();return false;" style="color:#C0392B;">Выйти</a></div>

<div id="backdrop" class="backdrop" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer">
  <div class="drawer-title">📘 Меню</div>
  <button class="drawer-item" onclick="showSection('lesson')">📖 Урок</button>
  <button class="drawer-item" onclick="showSection('trainers')">🧠 Тренажёры</button>
  <button class="drawer-item" onclick="showSection('calendar')">📅 Мои занятия</button>
  <button class="drawer-item" onclick="showSection('tutorInfo')">👤 Мой репетитор</button>
  <hr class="drawer-hr">
  <button class="drawer-item" onclick="showSection('settings')">⚙️ Настройки</button>
  <hr class="drawer-hr">
  <button id="installBtnDrawer" class="drawer-item" style="display:none;">📲 Установить приложение</button>
  <button class="drawer-item" onclick="doLogout()" style="color:#C0392B;">🚪 Выйти</button>
</div>

<div id="appRoot" style="display:none;">
<div class="wrap">
  <div style="display:flex; align-items:center; gap:0.625rem; margin-bottom:0.25rem;">
    <button class="hamburger" onclick="openDrawer()">☰</button>
    <h1 id="headerGreeting" style="margin:0;">👋 Привет!</h1>
  </div>
  <div class="sub" style="margin-top:0.375rem; display:flex; align-items:center; gap:0.5rem;">
    <span>Всё для твоего урока — здесь.</span>
    <span id="lessonCounterPill"></span>
  </div>
  <div id="tutorSwitcher" style="margin-top:0.625rem;"></div>
  <div id="mainArea" style="margin-top:1rem;"></div>
</div>
</div>

<script src="student/shared.js"></script>
<script src="student/calendar.js"></script>
<script src="student/sections.js"></script>
<script src="student/switcher.js"></script>
<script src="student/main.js"></script>
<script type="module" src="student/firebase.js"></script>
</body>
</html>
