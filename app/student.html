<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Мой урок</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1F2A3D">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div id="loadingScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; color:#8A93A0; font-family:'IBM Plex Sans',sans-serif; font-size:0.875rem;">Загружаю…</div>
<div id="notFoundOverlay" style="display:none; min-height:100vh; align-items:center; justify-content:center; padding:1.5rem; text-align:center; color:#5A6472; position:fixed; inset:0; background:#F3F5F1;">Не получилось найти твои данные. Попроси преподавателя проверить код приглашения.<br><br><a href="#" onclick="doLogout();return false;" style="color:#C0392B;">Выйти</a></div>

<div id="backdrop" class="backdrop" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer">
  <div class="drawer-title">📘 Меню</div>
  <button class="drawer-item" onclick="showSection('lesson')">📖 Урок</button>
  <button class="drawer-item" onclick="showSection('trainers')">🧠 Тренажёры</button>
  <button class="drawer-item" onclick="showSection('calendar')">📅 Мои занятия</button>
  <button class="drawer-item" onclick="showSection('tutorInfo')">👤 Мой репетитор</button>
  <hr class="drawer-hr">
  <button class="drawer-item" onclick="showSection('settings')">⚙️ Настройки</button>
  <hr class="drawer-hr">
  <button id="installBtnDrawer" class="drawer-item" style="display:none;">📲 Установить приложение</button>
  <button class="drawer-item" onclick="doLogout()" style="color:#C0392B;">🚪 Выйти</button>
</div>

<div id="appRoot" style="display:none;">
<div class="wrap">
  <div style="display:flex; align-items:center; gap:0.625rem; margin-bottom:0.25rem;">
    <button class="hamburger" onclick="openDrawer()">☰</button>
    <h1 id="headerGreeting" style="margin:0;">👋 Привет!</h1>
  </div>
  <div class="sub" style="margin-top:0.375rem; display:flex; align-items:center; gap:0.5rem;">
    <span>Всё для твоего урока — здесь.</span>
    <span id="lessonCounterPill"></span>
  </div>
  <div id="tutorSwitcher" style="margin-top:0.625rem;"></div>
  <div id="mainArea" style="margin-top:1rem;"></div>
</div>
</div>

<script>
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function showToast(message, type='error', duration=10000){
  let wrap = document.getElementById('toastWrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  wrap.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const span = document.createElement('span');
  span.style.flex = '1';
  span.textContent = message;
  const close = document.createElement('span');
  close.style.opacity = '.6';
  close.textContent = '✕';
  el.appendChild(span); el.appendChild(close);
  el.onclick = () => el.classList.remove('show');
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function materialIcon(url){
  const clean = (url||'').split('?')[0].toLowerCase();
  if(clean.endsWith('.pdf')) return '📕';
  if(/\.(jpg|jpeg|png|gif|webp|heic)$/.test(clean)) return '🖼️';
  if(/\.(mp4|mov|avi|webm|mkv)$/.test(clean)) return '🎬';
  if(/\.(doc|docx)$/.test(clean)) return '📄';
  if(/\.(xls|xlsx|csv)$/.test(clean)) return '📊';
  if(/\.(ppt|pptx)$/.test(clean)) return '📽️';
  return '🔗';
}

const THEMES = {
  classic: { name:'Классика', bg:'#F3F5F1', accent:'#1F2A3D' },
  mint:    { name:'Мята',     bg:'#EAF4EE', accent:'#2E7D4F' },
  sky:     { name:'Небо',     bg:'#E7EEF6', accent:'#2C4A7C' },
  peach:   { name:'Персик',   bg:'#FBEEE4', accent:'#B5651D' },
  lavender:{ name:'Лаванда',  bg:'#EFEAF6', accent:'#6A4C93' },
  pink:    { name:'Розовый',  bg:'#FBEAF0', accent:'#C2547A' },
};
let currentTheme = 'classic';
function themePickerHTML(){
  return `<div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
    ${Object.entries(THEMES).map(([id, t]) => `
      <button onclick="pickTheme('${id}')" title="${t.name}" style="width:2.25rem; height:2.25rem; border-radius:999px; border:2px solid ${currentTheme===id?'#1F2A3D':'transparent'}; background:${t.accent}; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        ${currentTheme===id ? '<span style="color:#fff; font-size:0.875rem;">✓</span>' : ''}
      </button>`).join('')}
  </div>`;
}
function pickTheme(themeId){
  currentTheme = themeId;
  applyTheme();
  if(window.__fbSetTheme) window.__fbSetTheme(themeId);
  const picker = document.getElementById('themePicker');
  if(picker) picker.innerHTML = themePickerHTML();
}
function applyTheme(){
  const t = THEMES[currentTheme] || THEMES.classic;
  document.body.style.backgroundColor = t.bg;
  const card = document.querySelector('#mainArea .card');
  if(card) card.style.borderTop = `3px solid ${t.accent}`;
}

// ---- typed contacts (matches tutor.html's CONTACT_TYPES) ----
const CONTACT_TYPES = {
  telegram: { label:'Telegram', icon:'✈️', action:'Написать в Telegram', build: v => `https://t.me/${v}` },
  whatsapp: { label:'WhatsApp', icon:'📱', action:'Написать в WhatsApp', build: v => `https://wa.me/${v}` },
  vk:       { label:'ВК',       icon:'💬', action:'Написать в ВК', build: v => `https://vk.com/im?sel=${v}` },
  phone:    { label:'Телефон',  icon:'☎️', action:'Позвонить', build: v => `tel:${v}` },
  email:    { label:'Почта',    icon:'✉️', action:'Написать на почту', build: v => `mailto:${v}` },
};
function contactLink(c){ const t = CONTACT_TYPES[c.type]; return (t && c.value) ? t.build(c.value) : '#'; }
function contactLabel(c){ const t = CONTACT_TYPES[c.type]; return t ? t.label : 'контакт'; }
function contactAction(c){ const t = CONTACT_TYPES[c.type]; return t ? t.action : 'Написать'; }
function contactIcon(c){ const t = CONTACT_TYPES[c.type]; return t ? t.icon : '🔗'; }

let accountPanelOpen = false;
function toggleAccountPanel(){
  accountPanelOpen = !accountPanelOpen;
  const el = document.getElementById('accountPanel');
  if(el) el.style.display = accountPanelOpen ? 'block' : 'none';
}

let otherContactsOpen = false;
function toggleOtherContacts(){
  otherContactsOpen = !otherContactsOpen;
  const el = document.getElementById('otherContacts');
  if(el) el.style.display = otherContactsOpen ? 'block' : 'none';
}

let viewSection = 'lesson';
let lastStudent = null, lastMaterials = [], lastProfile = null;

function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('backdrop').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('backdrop').classList.remove('open'); }
function showSection(section){ viewSection = section; closeDrawer(); renderStudentView(lastStudent, lastMaterials, lastProfile); }

const stubCard = (icon, text) => `<div class="card"><div class="body" style="text-align:center; padding:2rem 1rem; color:#B7BEC7;">
  <div style="font-size:2rem; margin-bottom:0.5rem;">${icon}</div>
  <div style="font-size:0.9375rem; font-weight:600; margin-bottom:0.25rem;">${text}</div>
  <div style="font-size:0.78125rem;">Скоро здесь что-то появится</div>
</div></div>`;

function renderLessonSection(student, materials, profile){
  const allFiles = activeSubjectFilter ? (materials||[]).filter(f => f.subject === activeSubjectFilter) : (materials || []);
  const tutorName = (profile && profile.name) ? esc(profile.name) : null;
  const emptyText = tutorName
    ? `Здесь появятся материалы, как только ${tutorName} их добавит`
    : `Здесь появятся материалы, как только их добавит твой репетитор`;
  return `
    <div style="display:flex; align-items:center; gap:0.5rem; padding:0.5rem 0.625rem; border-radius:0.625rem; background:#F1F3F5; color:#B7BEC7; font-size:0.8125rem; margin-bottom:0.75rem;">🕐 Следующее занятие<span style="margin-left:auto; font-size:0.6875rem; background:#fff; color:#8A93A0; padding:0.1rem 0.4rem; border-radius:999px;">скоро</span></div>
    <div class="card"><div class="body">
      ${student.format!=='Очно' ? `
        <div class="row" style="margin-bottom:0.5rem;">
          <a class="btn ${student.callLink?'':'btn-off'}" href="${student.callLink?esc(student.callLink):'#'}" target="_blank" style="background:${student.callLink?'#1F2A3D':''};color:${student.callLink?'#fff':''}">🎥 Звонок</a>
          <a class="btn ${student.boardLink?'':'btn-off'}" href="${student.boardLink?esc(student.boardLink):'#'}" target="_blank" style="background:${student.boardLink?'#C0392B':''};color:${student.boardLink?'#fff':''}">✏️ Доска</a>
        </div>` : `<div style="font-size:0.8125rem; color:#5A6472; margin-bottom:0.75rem;">Занятие очное — увидимся на месте 🤝</div>`}
      <div class="filelabel">Материалы к уроку</div>
      ${allFiles.length===0 ? `
        <div style="text-align:center; padding:1.25rem 0.5rem; color:#B7BEC7;">
          <div style="font-size:1.75rem; margin-bottom:0.375rem;">🗂️</div>
          <div style="font-size:0.8125rem;">${emptyText}</div>
        </div>` : (() => {
          const discussList = allFiles.filter(f => (f.category||'discuss') === 'discuss');
          const practiceList = allFiles.filter(f => f.category === 'practice');
          const row = f => `<div class="filerow"><span>${materialIcon(f.url)}</span><a href="${esc(f.url)}" target="_blank">${esc(f.name||f.url)}</a></div>`;
          let out = '';
          if(discussList.length){ out += `<div style="font-size:0.71875rem; font-weight:700; color:#8A93A0; text-transform:uppercase; letter-spacing:.4px; margin:0.5rem 0 0.25rem;">📖 Разбираем</div>` + discussList.map(row).join(''); }
          if(practiceList.length){ out += `<div style="font-size:0.71875rem; font-weight:700; color:#8A93A0; text-transform:uppercase; letter-spacing:.4px; margin:0.5rem 0 0.25rem;">🏋️ Тренируемся</div>` + practiceList.map(row).join(''); }
          return out;
        })()}
    </div></div>`;
}

function renderTutorSection(profile){
  const p = profile || {};
  if(!p.name){
    return `<div class="card"><div class="body" style="text-align:center; padding:2rem 1rem; color:#9BA3AE;">Репетитор пока не заполнил профиль</div></div>`;
  }
  const contacts = p.contacts || [];
  const primary = contacts.find(c => c.id === p.primaryContactId) || contacts[0];
  const others = contacts.filter(c => c !== primary);
  return `
    <div class="card"><div class="body">
      <div style="font-size:0.71875rem; font-weight:700; color:#8A93A0; text-transform:uppercase; letter-spacing:.4px; margin-bottom:0.375rem;">Репетитор</div>
      <div style="font-weight:600; font-size:1rem;">${esc(p.name)}</div>
      ${p.showSubject && ((p.subjects && p.subjects.length) || p.subject) ? `<div style="font-size:0.8125rem; color:#5A6472; margin-top:0.125rem;">${esc((p.subjects && p.subjects.length ? p.subjects : [p.subject]).join(' · '))}</div>` : ''}
      ${p.showContacts && primary ? `
        <a href="${contactLink(primary)}" target="_blank" title="${esc(contactLink(primary))}" style="display:flex; align-items:center; justify-content:center; gap:0.5rem; margin-top:0.875rem; padding:0.625rem 0; border-radius:0.625rem; background:#1F2A3D; color:#fff; font-weight:600; font-size:0.875rem; text-decoration:none;">
          ${contactIcon(primary)} ${contactAction(primary)}
        </a>` : ''}
      ${p.showContacts && others.length ? `
        <div style="text-align:center; margin-top:0.5rem;">
          <a href="#" onclick="toggleOtherContacts();return false;" style="font-size:0.75rem; color:#5A6472;">другие способы связи</a>
        </div>
        <div id="otherContacts" style="display:${otherContactsOpen?'block':'none'}; margin-top:0.5rem;">
          <div style="display:flex; flex-wrap:wrap; gap:0.375rem; justify-content:center;">
            ${others.map(c=>`<a href="${contactLink(c)}" target="_blank" title="${esc(contactLink(c))}" style="display:inline-flex; align-items:center; gap:0.3rem; padding:0.3rem 0.625rem; border-radius:999px; font-size:0.75rem; font-weight:600; background:#EAF0F6; color:#2C4A7C; text-decoration:none;">${contactIcon(c)} ${contactLabel(c)}</a>`).join('')}
          </div>
        </div>` : ''}
    </div></div>`;
}

function renderSettingsSection(){
  return `
    <div class="card"><div class="body">
      <div class="filelabel">Моя тема</div>
      <div id="themePicker">${themePickerHTML()}</div>
    </div></div>
    <div class="card" style="margin-top:0.75rem;"><div class="body">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div class="filelabel" style="margin:0;">Пароль</div>
        <a href="#" onclick="toggleAccountPanel();return false;" style="font-size:0.78125rem; color:#5A6472;">Сменить</a>
      </div>
      <div id="accountPanel" style="display:${accountPanelOpen?'block':'none'}; margin-top:0.625rem;">
        <div style="font-size:0.78125rem; color:#5A6472; margin-bottom:0.625rem;">Чтобы сменить пароль, подтверди текущим</div>
        <input id="accCurPass" type="password" placeholder="текущий пароль" style="width:100%; font-size:0.84375rem; padding:0.5rem 0.625rem; border-radius:0.5rem; border:1px solid #C9D2DB; margin-bottom:0.5rem;">
        <input id="accNewPass" type="password" placeholder="новый пароль (мин. 6 символов)" style="width:100%; font-size:0.84375rem; padding:0.5rem 0.625rem; border-radius:0.5rem; border:1px solid #C9D2DB; margin-bottom:0.5rem;">
        <button onclick="changePassword()" style="width:100%; padding:0.5rem 0; border-radius:0.625rem; border:none; background:#1F2A3D; color:#fff; font-weight:600; font-size:0.8125rem; cursor:pointer;">Сменить пароль</button>
      </div>
    </div></div>
    <div class="card" style="margin-top:0.75rem;"><div class="body">
      <div class="filelabel">Добавиться к новому репетитору</div>
      <div style="font-size:0.75rem; color:#9BA3AE; margin-bottom:0.5rem;">Если занимаешься ещё с кем-то — впиши код, который он тебе даст</div>
      <div style="display:flex; gap:0.375rem;">
        <input id="newTutorCode" type="text" placeholder="код репетитора" style="flex:1; font-size:0.84375rem; padding:0.5rem 0.625rem; border-radius:0.5rem; border:1px solid #C9D2DB; text-transform:uppercase;">
        <button onclick="addTutorByCode()" style="padding:0 1rem; border-radius:0.625rem; border:none; background:#1F2A3D; color:#fff; font-weight:600; font-size:0.8125rem; cursor:pointer;">Добавить</button>
      </div>
    </div></div>`;
}

let allTutorLinks = []; // [{tutorUid, studentId, tutorName, subjectFilter, label}]
let activeLinkIndex = 0;
let activeSubjectFilter = null;
function renderTutorSwitcher(){
  const el = document.getElementById('tutorSwitcher');
  if(!el) return;
  if(allTutorLinks.length <= 1){ el.innerHTML = ''; return; }
  el.innerHTML = `<div style="display:flex; gap:0.375rem; flex-wrap:wrap;">
    ${allTutorLinks.map((l,i) => `<button onclick="switchTutorLink(${i})" style="padding:0.375rem 0.75rem; border-radius:999px; border:1px solid ${i===activeLinkIndex?'#1F2A3D':'#C9D2DB'}; background:${i===activeLinkIndex?'#1F2A3D':'#fff'}; color:${i===activeLinkIndex?'#fff':'#5A6472'}; font-size:0.78125rem; font-weight:600; cursor:pointer;">Ты у ${esc(l.label || 'репетитора')}</button>`).join('')}
  </div>`;
}
function switchTutorLink(i){
  if(i === activeLinkIndex) return;
  const link = allTutorLinks[i];
  const prev = allTutorLinks[activeLinkIndex];
  activeLinkIndex = i;
  activeSubjectFilter = link.subjectFilter;
  if(!prev || prev.tutorUid !== link.tutorUid || prev.studentId !== link.studentId){
    if(window.__fbSwitchTutor) window.__fbSwitchTutor(link);
  } else {
    renderStudentView(lastStudent, lastMaterials, lastProfile);
  }
  renderTutorSwitcher();
}
async function addTutorByCode(){
  const input = document.getElementById('newTutorCode');
  const code = input.value.trim().toUpperCase();
  if(!code){ showToast('Впиши код'); return; }
  if(!window.__fbAddTutorByCode){ showToast('Сейчас недоступно, попробуй позже'); return; }
  try{
    await window.__fbAddTutorByCode(code);
    showToast('Добавлено! Переключись сверху, чтобы посмотреть', 'success', 5000);
    input.value = '';
  }catch(e){
    showToast(e.message || 'Не получилось добавить — проверь код');
  }
}

function renderStudentView(student, materials, profile){
  lastStudent = student; lastMaterials = materials || []; lastProfile = profile;
  const root = document.getElementById('appRoot');
  document.getElementById('loadingScreen').style.display = 'none';
  if(!student){
    root.style.display = 'none';
    document.getElementById('notFoundOverlay').style.display = 'flex';
    return;
  }
  document.getElementById('notFoundOverlay').style.display = 'none';
  root.style.display = 'block';
  document.getElementById('headerGreeting').textContent = `👋 Привет, ${student.name}!`;
  renderTutorSwitcher();
  const count = student.completedLessonsCount || 0;
  document.getElementById('lessonCounterPill').innerHTML = count > 0
    ? `<span style="font-size:0.75rem; font-weight:600; background:#E2EFE6; color:#1F5C3A; padding:0.2rem 0.5rem; border-radius:999px;">🎉 Уже ${count} занят${count===1?'ие':(count<5?'ия':'ий')} вместе</span>`
    : '';

  const mainArea = document.getElementById('mainArea');
  if(viewSection === 'trainers') mainArea.innerHTML = stubCard('🧠', 'Тренажёры');
  else if(viewSection === 'calendar') mainArea.innerHTML = stubCard('📅', 'Мои занятия');
  else if(viewSection === 'tutorInfo') mainArea.innerHTML = renderTutorSection(profile);
  else if(viewSection === 'settings') mainArea.innerHTML = renderSettingsSection();
  else mainArea.innerHTML = renderLessonSection(student, materials, profile);

  applyTheme();
}
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signOut,
    EmailAuthProvider, reauthenticateWithCredential, updatePassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, getDocs, setDoc, onSnapshot, collection, query, where, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "../assets/firebase-config.js";

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  window.doLogout = async function () { await signOut(auth); window.location.replace('../index.html'); };

  function friendlyAuthError(e){
    const map = {
      'auth/invalid-credential': 'Неверный текущий пароль.',
      'auth/wrong-password': 'Неверный текущий пароль.',
      'auth/weak-password': 'Новый пароль слишком простой — сделай его длиннее.',
      'auth/too-many-requests': 'Слишком много попыток — подожди немного и попробуй снова.',
      'auth/network-request-failed': 'Нет связи с интернетом — проверь подключение.',
    };
    return map[e && e.code] || 'Что-то пошло не так — попробуй ещё раз.';
  }

  window.changePassword = async function () {
    const curPass = document.getElementById('accCurPass').value;
    const newPass = document.getElementById('accNewPass').value;
    if (!curPass || !newPass) { showToast('Заполни текущий и новый пароль'); return; }
    if (newPass.length < 6) { showToast('Новый пароль слишком короткий (мин. 6 символов)'); return; }
    try {
      const cred = EmailAuthProvider.credential(auth.currentUser.email, curPass);
      await reauthenticateWithCredential(auth.currentUser, cred);
      await updatePassword(auth.currentUser, newPass);
      showToast('Пароль обновлён!', 'success', 4000);
      document.getElementById('accNewPass').value = '';
      document.getElementById('accCurPass').value = '';
    } catch (e) {
      showToast(friendlyAuthError(e));
    }
  };

  function migrateStudent(s){
    if(!Array.isArray(s.messengers)){ s.messengers = s.messenger ? [{id:'m1', label:'', url:s.messenger}] : []; }
    delete s.messenger;
    return s;
  }

  let unsubActive = []; // holds unsubscribe fns for the currently subscribed tutor's data
  function subscribeToTutor(tutorUid, studentId){
    unsubActive.forEach(fn => { try{ fn(); }catch(e){} });
    unsubActive = [];

    const studentRef = doc(db, 'users', tutorUid, 'students', studentId);
    const themeRef = doc(db, 'users', tutorUid, 'students', studentId, 'prefs', 'theme');
    const profileRef = doc(db, 'users', tutorUid, 'appdata', 'profile');
    let studentData = null;
    let materialsAll = [], materialsMine = [];
    let tutorProfile = null;

    window.__fbSetTheme = async function (themeId) {
      try { await setDoc(themeRef, { theme: themeId }); }
      catch (e) { console.error('save theme failed', e); }
    };

    function renderMerged(){
      const byId = {};
      [...materialsAll, ...materialsMine].forEach(m => { byId[m.id] = m; });
      renderStudentView(studentData, Object.values(byId), tutorProfile);
    }

    unsubActive.push(onSnapshot(studentRef, (snap) => {
      studentData = snap.exists() ? migrateStudent(snap.data()) : null;
      renderMerged();
    }, () => renderStudentView(null, [])));

    unsubActive.push(onSnapshot(themeRef, (snap) => {
      currentTheme = snap.exists() ? (snap.data().theme || 'classic') : 'classic';
      applyTheme();
      const picker = document.getElementById('themePicker');
      if (picker) picker.innerHTML = themePickerHTML();
    }, () => {}));

    unsubActive.push(onSnapshot(profileRef, (snap) => {
      tutorProfile = snap.exists() ? snap.data() : null;
      renderMerged();
    }, (err) => console.error('profile sync error', err)));

    const materialsCol = collection(db, 'users', tutorUid, 'materials');
    unsubActive.push(onSnapshot(query(materialsCol, where('visibleToAll', '==', true)), (snap) => {
      materialsAll = snap.docs.map(d => d.data());
      renderMerged();
    }, (err) => console.error('materials(all) sync error', err)));
    unsubActive.push(onSnapshot(query(materialsCol, where('studentIds', 'array-contains', studentId)), (snap) => {
      materialsMine = snap.docs.map(d => d.data());
      renderMerged();
    }, (err) => console.error('materials(mine) sync error', err)));
  }

  window.__fbSwitchTutor = function (link) {
    subscribeToTutor(link.tutorUid, link.studentId);
  };

  window.__fbAddTutorByCode = async function (code) {
    const linkRef = doc(db, 'studentLinks', code);
    const myUid = auth.currentUser.uid;
    await runTransaction(db, async (tx) => {
      const linkSnap = await tx.get(linkRef);
      if (!linkSnap.exists() || linkSnap.data().claimed) {
        throw new Error('Такого кода не существует или он уже использован');
      }
      const { tutorUid, studentId } = linkSnap.data();
      tx.update(linkRef, { claimed: true, claimedBy: myUid });
      tx.set(doc(db, 'studentAccess', myUid), { isStudent: true }, { merge: true });
      tx.set(doc(db, 'studentAccess', myUid, 'links', tutorUid), { studentId });
    });
    await loadAllTutorLinks(myUid);
  };

  async function loadAllTutorLinks(uid){
    const linksSnap = await getDocs(collection(db, 'studentAccess', uid, 'links'));
    const expanded = [];
    for (const d of linksSnap.docs) {
      const tutorUid = d.id;
      const { studentId } = d.data();
      let tutorName = null;
      try {
        const p = await getDoc(doc(db, 'users', tutorUid, 'appdata', 'profile'));
        if (p.exists()) tutorName = p.data().name;
      } catch (e) {}
      const shortName = tutorName ? (tutorName.split(' ')[1] || tutorName) : null;

      let subjects = [];
      try {
        const sSnap = await getDoc(doc(db, 'users', tutorUid, 'students', studentId));
        if (sSnap.exists()) {
          const subs = (sSnap.data().subjects || []).map(x => x.subject).filter(Boolean);
          subjects = [...new Set(subs)];
        }
      } catch (e) {}

      if (subjects.length > 1) {
        subjects.forEach(subj => {
          expanded.push({ tutorUid, studentId, tutorName: shortName, subjectFilter: subj,
            label: `${shortName || 'репетитора'} · ${subj}` });
        });
      } else {
        expanded.push({ tutorUid, studentId, tutorName: shortName, subjectFilter: null,
          label: shortName || 'репетитора' });
      }
    }
    allTutorLinks = expanded;
    return expanded;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('../index.html'); return; }

    const accessSnap = await getDoc(doc(db, 'studentAccess', user.uid));
    if (!accessSnap.exists()) { window.location.replace('tutor.html'); return; }

    const links = await loadAllTutorLinks(user.uid);
    if (links.length === 0) { renderStudentView(null, []); return; }

    activeLinkIndex = 0;
    activeSubjectFilter = links[0].subjectFilter;
    subscribeToTutor(links[0].tutorUid, links[0].studentId);
  });

  if ("serviceWorker" in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("../sw.js").then((reg) => {
        reg.update();
        setInterval(() => reg.update(), 60000);
      }).catch(() => {});
    });
  }

  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('installBtnDrawer');
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (!isStandalone) installBtn.style.display = 'flex';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = 'none';
    closeDrawer();
  });
  window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
</script>
</body>
</html>
