<body>
<div id="loadingScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; color:#8A93A0; font-family:'IBM Plex Sans',sans-serif; font-size:0.875rem;">Загружаю…</div>

<div id="backdrop" class="backdrop" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer">
  <div class="drawer-title">📘 Меню</div>

  <button class="drawer-item" onclick="showStudentsView()">👥 Все ученики</button>
  <button class="drawer-item" onclick="toggleDrawerSection('online')">💻 Онлайн <span id="onlineArrow" style="margin-left:auto; opacity:.5;">▾</span></button>
  <div id="drawerOnline"></div>
  <button class="drawer-item" onclick="toggleDrawerSection('inperson')">🤝 Очно <span id="inpersonArrow" style="margin-left:auto; opacity:.5;">▾</span></button>
  <div id="drawerInperson"></div>
  <button class="drawer-item" onclick="addStudent(); closeDrawer();">➕ Добавить ученика</button>

  <hr class="drawer-hr">
  <button class="drawer-item" onclick="showMaterialsView()">📚 Материалы</button>
  <button class="drawer-item" onclick="showFriendsView()">👥 Друзья</button>
  <button class="drawer-item" style="color:#B7BEC7; cursor:default;" onclick="showToast('Календарь занятий — в работе, скоро будет.', 'info', 4000)">📅 Календарь <span style="margin-left:auto; font-size:0.6875rem; background:#F1F3F5; color:#8A93A0; padding:0.1rem 0.4rem; border-radius:999px;">скоро</span></button>

  <hr class="drawer-hr">
  <button class="drawer-item" onclick="showSettingsView()">⚙️ Настройки</button>
  <input id="restoreFile" type="file" accept="application/json" style="display:none;" onchange="restoreBackup(this)">

  <hr class="drawer-hr">
  <button id="installBtnDrawer" class="drawer-item" style="display:none;">📲 Установить приложение</button>
  <button class="drawer-item" onclick="doLogout()" style="color:#C0392B;">🚪 Выйти</button>
</div>

<div id="appRoot" style="display:none;">
<div class="wrap">
  <div style="display:flex; align-items:center; gap:0.625rem; margin-bottom:0.25rem;">
    <button class="hamburger" onclick="openDrawer()">☰</button>
    <h1 style="margin:0;">📘 Перед уроком</h1>
  </div>
  <div class="sub" style="margin-top:0.375rem;">Ссылки, доски и материалы — по каждому ученику. Синхронизируется на всех устройствах.</div>
  <div id="mainArea"></div>
</div>
</div>

<script>
const KEY = 'tutoring-app-data-v1';

function showToast(message, type='error', duration=10000){
  let wrap = document.getElementById('toastWrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  wrap.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const span = document.createElement('span');
  span.style.flex = '1';
  span.textContent = message;
  const close = document.createElement('span');
  close.style.opacity = '.6';
  close.textContent = '✕';
  el.appendChild(span); el.appendChild(close);
  el.onclick = () => el.classList.remove('show');
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function materialIcon(url){
  const clean = (url||'').split('?')[0].toLowerCase();
  if(clean.endsWith('.pdf')) return '📕';
  if(/\.(jpg|jpeg|png|gif|webp|heic)$/.test(clean)) return '🖼️';
  if(/\.(mp4|mov|avi|webm|mkv)$/.test(clean)) return '🎬';
  if(/\.(doc|docx)$/.test(clean)) return '📄';
  if(/\.(xls|xlsx|csv)$/.test(clean)) return '📊';
  if(/\.(ppt|pptx)$/.test(clean)) return '📽️';
  return '🔗';
}

const THEMES = {
  classic: { name:'Классика', bg:'#F3F5F1', accent:'#1F2A3D' },
  mint:    { name:'Мята',     bg:'#EAF4EE', accent:'#2E7D4F' },
  sky:     { name:'Небо',     bg:'#E7EEF6', accent:'#2C4A7C' },
  peach:   { name:'Персик',   bg:'#FBEEE4', accent:'#B5651D' },
  lavender:{ name:'Лаванда',  bg:'#EFEAF6', accent:'#6A4C93' },
  pink:    { name:'Розовый',  bg:'#FBEAF0', accent:'#C2547A' },
};
function themePickerHTML(currentTheme, onClickFn){
  return `<div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
    ${Object.entries(THEMES).map(([id, t]) => `
      <button onclick="${onClickFn}('${id}')" title="${t.name}" style="width:2.25rem; height:2.25rem; border-radius:999px; border:2px solid ${currentTheme===id?'#1F2A3D':'transparent'}; background:${t.accent}; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        ${currentTheme===id ? '<span style="color:#fff; font-size:0.875rem;">✓</span>' : ''}
      </button>`).join('')}
  </div>`;
}

const ACCENTS = [
  {ink:'#C0392B', soft:'#F6E4E1'},
  {ink:'#2E7D4F', soft:'#E2EFE6'},
  {ink:'#2C4A7C', soft:'#E3E9F1'},
  {ink:'#B5651D', soft:'#F3E5D6'},
  {ink:'#5A6472', soft:'#E7E9EC'},
];

function defaultData(){
  return {
    students: [
      {
        id: "sonya", name: "Соня", grade: "9 класс", format: "Онлайн",
        accent: 0, messengers: [{id:'m1', label:'ВК (Соня)', url:'https://vk.com/im?sel=630793840'}, {id:'m2', label:'ТГ (мама)', url:'https://t.me/Dontfaqmymind'}, {id:'m3', label:'ТГ (Соня)', url:'https://t.me/Coconutnv'}], boardLink: "https://unidraw.io/app/board/83192784a1059c3a4a4c", callLink: "https://telemost.yandex.ru/j/16483728930070",
        needsPaymentReport: true,
        subjects:[{label:'Школьная программа (1 ч)', price:'1700 ₽'},{label:'Подготовка к ОГЭ (1,5 ч)', price:'2900 ₽'}], files:[]
      },
      {id:'lera', name:'Лера', grade:'9 класс', format:'Очно', accent:1, messengers:[{id:'m1', label:'ТГ (Лера)', url:'https://t.me/Kotiktv3'}, {id:'m2', label:'ТГ (мама Леры)', url:'https://t.me/svetlana_2l'}], boardLink:'', callLink:'', needsPaymentReport:true,
       subjects:[{label:'Школьная программа (1 ч)', price:'1150 ₽'},{label:'Подготовка к ОГЭ (1,5 ч)', price:'2000 ₽'}], files:[]},
      {id:'ksyusha', name:'Ксюша', grade:'11 класс', format:'Онлайн', accent:2, messengers:[], boardLink:'', callLink:'', needsPaymentReport:true,
       subjects:[{label:'Подготовка к ЕГЭ (1,5 ч)', price:'2650 ₽'}], files:[]},
      {id:'nadya', name:'Надя', grade:'9 класс', format:'Очно', accent:4, messengers:[{id:'m1', label:'ТГ (Надя)', url:'https://t.me/omishonaa'}], boardLink:'', callLink:'', needsPaymentReport:false,
       subjects:[{label:'Школьная программа (сестра)', price:'Бесплатно'}], files:[]},
      {id:'anya8', name:'Аня', grade:'8 класс', format:'Онлайн', accent:3, messengers:[], boardLink:'', callLink:'', needsPaymentReport:true,
       subjects:[{label:'Школьная программа (1 ч)', price:'1700 ₽'}], files:[]},
    ],
    sharedFiles: [],
    openIds: [],
  };
}

function uid(){ return Math.random().toString(36).slice(2,9); }

function migrate(d){
  d.students.forEach(s => {
    if(!Array.isArray(s.messengers)){
      s.messengers = s.messenger ? [{id: uid(), label:'', url: s.messenger}] : [];
    }
    delete s.messenger;
  });
  return d;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? migrate(JSON.parse(raw)) : defaultData();
  }catch(e){ return defaultData(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
  if(window.__firestoreSave) window.__firestoreSave(data);
  render();
}

let data = defaultData(); // placeholder until Firebase auth + Firestore load finishes
const BASE_STUDENTS = defaultData().students;

function downloadBackup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `kabinet-repetitora-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function restoreBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = migrate(JSON.parse(reader.result));
      if(!Array.isArray(parsed.students)) throw new Error('bad format');
      if(!confirm('Заменить текущие данные содержимым файла? Текущие данные будут перезаписаны.')) return;
      data = parsed;
      if(!data.openIds) data.openIds = [];
      save();
    }catch(e){
      showToast('Не получилось прочитать файл — убедись, что это резервная копия, скачанная отсюда же.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function syncBaseLinks(){
  let changed = 0;
  data.students.forEach(s => {
    const base = BASE_STUDENTS.find(b => b.id === s.id);
    if(!base) return;
    if(base.callLink && s.callLink !== base.callLink){ s.callLink = base.callLink; changed++; }
    if(base.boardLink && s.boardLink !== base.boardLink){ s.boardLink = base.boardLink; changed++; }
    if(base.messengers && base.messengers.length){
      if(!Array.isArray(s.messengers)) s.messengers = [];
      base.messengers.forEach(bm => {
        if(!s.messengers.some(m => m.id === bm.id)){
          s.messengers.push({...bm});
          changed++;
        }
      });
    }
  });
  save();
  showToast(changed ? `Обновлено ссылок: ${changed}` : 'Уже всё актуально', 'success', 4000);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

async function copyText(text, btn){
  if(!text) return;
  try{ await navigator.clipboard.writeText(text); }catch(e){}
  btn.classList.add('copied');
  btn.textContent = '✓';
  setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent = '⧉'; }, 1200);
}

function toggleOpen(id){
  const i = data.openIds.indexOf(id);
  if(i>=0) data.openIds.splice(i,1); else data.openIds.push(id);
  save();
}

function updateStudent(id, patch){
  const s = data.students.find(x=>x.id===id);
  Object.assign(s, patch);
  save();
}
function deleteStudent(id){
  if(!confirm('Удалить ученика?')) return;
  data.students = data.students.filter(x=>x.id!==id);
  save();
}
function getInitials(fullName){
  return (fullName||'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase();
}
async function generateInviteCode(studentId){
  const tutorName = window.__profileData && window.__profileData.name;
  if(!tutorName){
    showToast('Сначала впиши своё ФИО в Настройках → «О себе» — без него код не собрать');
    return;
  }
  const initials = getInitials(tutorName);
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let rand = '';
  for(let i=0;i<5;i++) rand += chars[Math.floor(Math.random()*chars.length)];
  const code = `У-${initials}-${rand}`;
  if(!window.__fbCreateLink){ showToast('Нет связи с базой, попробуй позже'); return; }
  const ok = await window.__fbCreateLink(code, studentId);
  if(ok){
    const s = data.students.find(x=>x.id===studentId);
    s.inviteCode = code;
    save();
  } else {
    showToast('Не получилось создать код, попробуй ещё раз');
  }
}
async function revokeInviteCode(studentId){
  const s = data.students.find(x=>x.id===studentId);
  if(!s || !s.inviteCode) return;
  if(window.__fbRevokeLink) await window.__fbRevokeLink(s.inviteCode);
  delete s.inviteCode;
  save();
}

function addStudent(){
  data.students.push({id:uid(), name:'Новый ученик', grade:'', format:'Онлайн',
    accent: data.students.length % ACCENTS.length, messengers:[], boardLink:'', callLink:'',
    needsPaymentReport:true, subjects:[], files:[]});
  save();
}
let messengerAddKind = {}; // studentId -> 'child'|'parent', default 'child'
function setMessengerKind(sid, kind){ messengerAddKind[sid] = kind; render(); }
function groupMessengers(messengers){
  const child = [], parent = [];
  (messengers||[]).forEach(m => (m.for === 'parent' ? parent : child).push(m));
  return { child, parent };
}
function addMessenger(id){
  const s = data.students.find(x=>x.id===id);
  const labelEl = document.getElementById('mlabel-'+id);
  const urlEl = document.getElementById('murl-'+id);
  if(!urlEl.value) return;
  s.messengers.push({id:uid(), label:labelEl.value, url:urlEl.value, for: messengerAddKind[id] || 'child'});
  labelEl.value=''; urlEl.value='';
  save();
}
function removeMessenger(sid, mid){
  const s = data.students.find(x=>x.id===sid);
  s.messengers = s.messengers.filter(m=>m.id!==mid);
  save();
}
function addSubject(id){
  const s = data.students.find(x=>x.id===id);
  const labelEl = document.getElementById('sublabel-'+id);
  const priceEl = document.getElementById('subprice-'+id);
  if(!labelEl.value.trim()) { showToast('Впиши название тарифа'); return; }
  if(!Array.isArray(s.subjects)) s.subjects = [];
  s.subjects.push({ id: uid(), label: labelEl.value.trim(), price: priceEl.value.trim() });
  labelEl.value=''; priceEl.value='';
  save();
}
function removeSubject(sid, subId){
  const s = data.students.find(x=>x.id===sid);
  s.subjects = (s.subjects||[]).filter(sub=>sub.id!==subId);
  save();
}

let doneMsgFor = {};
function markDone(id){
  if(doneMsgFor[id]){
    delete doneMsgFor[id];
    render();
    return;
  }
  const s = data.students.find(x=>x.id===id);
  s.completedLessonsCount = (s.completedLessonsCount || 0) + 1;
  if(s.needsPaymentReport){
    const d = new Date();
    const dateStr = d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
    doneMsgFor[id] = `Здравствуйте! Занятие с ${s.name} ${dateStr} прошло — можно оплачивать 🙂`;
  } else {
    doneMsgFor[id] = `✓ Отмечено. Занятий с ${s.name} теперь: ${s.completedLessonsCount}`;
  }
  save();
  render();
}

let studentMsgOpen = {};
function materialsFor(studentId){
  return (data.materials||[]).filter(m => m.visibleToAll || (m.studentIds||[]).includes(studentId));
}

function buildStudentMessage(s){
  const lines = [];
  if(s.format!=='Очно' && s.callLink) lines.push(`Подключиться к занятию: ${s.callLink}`);
  if(s.format!=='Очно' && s.boardLink) lines.push(`Доска: ${s.boardLink}`);
  const allFiles = materialsFor(s.id);
  if(allFiles.length){
    lines.push('Материалы к уроку:');
    allFiles.forEach(f=> lines.push(`- ${f.name ? f.name+': ' : ''}${f.url}`));
  }
  if(lines.length===0) return null;
  return `Привет, ${s.name}! Вот что нужно для занятия:\n\n${lines.join('\n')}`;
}
function toggleStudentMsg(id){
  if(studentMsgOpen[id]) delete studentMsgOpen[id]; else studentMsgOpen[id] = true;
  render();
}

let msgTextById = {};
function renderStudentMsgBox(s){
  const text = buildStudentMessage(s);
  if(!text){
    return `<div class="msgbox" style="border-color:#E3E3D8;"><div style="flex:1;">Пока нет ни ссылок, ни материалов у ${esc(s.name)} — добавь их ниже, и здесь появится готовый текст.</div></div>`;
  }
  msgTextById[s.id] = text;
  return `<div class="msgbox" style="white-space:pre-wrap;"><div style="flex:1;">${esc(text)}</div><button class="iconbtn" onclick="copyStudentMsg('${s.id}', this)">⧉</button></div>`;
}
function copyStudentMsg(id, btn){ copyText(msgTextById[id], btn); }

function cardHTML(s){
    const accent = ACCENTS[s.accent] || ACCENTS[0];
    const open = data.openIds.includes(s.id);
    const tags = s.subjects.map(sub=>`<span class="tag">${esc(sub.label)} · ${esc(sub.price)}</span>`).join('');
    const msg = doneMsgFor[s.id];
    const studentTheme = studentThemes[s.id];
    const themeBadge = (studentTheme && studentTheme !== 'classic' && THEMES[studentTheme])
      ? `<span style="position:absolute; bottom:-0.125rem; right:-0.125rem; width:0.5rem; height:0.5rem; border-radius:999px; background:${THEMES[studentTheme].accent}; border:1.5px solid #fff;"></span>`
      : '';
    return `
    <div class="card">
      <div class="card-head" style="background:${accent.soft}" onclick="toggleOpen('${s.id}')">
        <div style="position:relative; flex-shrink:0;">
          <div class="dot" style="background:${accent.ink}"></div>
          ${themeBadge}
        </div>
        <div style="flex:1;min-width:0;">
          <div class="name">${esc(s.name)}</div>
          <div class="meta">${esc(s.grade)} · ${esc(s.format)}</div>
        </div>
        <button class="chev ${open?'open':''}">⌄</button>
      </div>
      <div class="body">
        <div class="tags">${tags}</div>
        <div class="row">
          ${s.format!=='Очно'?`<a class="btn ${s.callLink?'':'btn-off'}" href="${s.callLink?esc(s.callLink):'#'}" target="_blank" style="background:${s.callLink?'#1F2A3D':''};color:${s.callLink?'#fff':''}" onclick="${s.callLink?'':'return false;'}">🎥 Звонок</a>`:''}
          ${s.format!=='Очно'?`<a class="btn ${s.boardLink?'':'btn-off'}" href="${s.boardLink?esc(s.boardLink):'#'}" target="_blank" style="background:${s.boardLink?accent.ink:''};color:${s.boardLink?'#fff':''}" onclick="${s.boardLink?'':'return false;'}">✏️ Доска</a>`:''}
          <button class="btn btn-done" onclick="markDone('${s.id}')">✓ Урок прошёл</button>
        </div>
        ${(() => {
          const g = groupMessengers(s.messengers);
          const chips = list => `<div class="chiprow">${list.map(m=>`<a class="chip" href="${esc(m.url)}" target="_blank">💬 ${esc(m.label||'Чат')}</a>`).join('')}</div>`;
          if(!g.child.length && !g.parent.length) return '';
          let out = '';
          if(g.child.length) out += chips(g.child);
          if(g.child.length && g.parent.length) out += `<hr style="border:none; border-top:1px solid #EEF0F2; margin:0.5rem 0;">`;
          if(g.parent.length) out += chips(g.parent);
          return out;
        })()}
        <button class="btn" style="width:100%;margin-top:8px;background:${accent.soft};color:${accent.ink};border:1px solid ${accent.soft};" onclick="toggleStudentMsg('${s.id}')">📨 Сообщение ученику со ссылками</button>
        ${msg?`<div class="msgbox"><div style="flex:1;">${esc(msg)}</div>${s.needsPaymentReport?`<button class="iconbtn" onclick="copyText('${esc(msg)}', this)">⧉</button>`:''}</div>`:''}
        ${studentMsgOpen[s.id] ? renderStudentMsgBox(s) : ''}
      </div>
      <div class="edit ${open?'open':''}">
        <div style="display:flex; gap:0.375rem; padding-top:0.75rem; margin-bottom:0.625rem;">
          <button onclick="updateStudent('${s.id}',{format:'Онлайн'})" style="flex:1; padding:0.4375rem 0; border-radius:0.5rem; font-size:0.78125rem; font-weight:600; border:1px solid ${s.format!=='Очно'?accent.ink:'#C9D2DB'}; background:${s.format!=='Очно'?accent.soft:'#fff'}; color:${s.format!=='Очно'?accent.ink:'#8A93A0'}; cursor:pointer;">💻 Онлайн</button>
          <button onclick="updateStudent('${s.id}',{format:'Очно'})" style="flex:1; padding:0.4375rem 0; border-radius:0.5rem; font-size:0.78125rem; font-weight:600; border:1px solid ${s.format==='Очно'?accent.ink:'#C9D2DB'}; background:${s.format==='Очно'?accent.soft:'#fff'}; color:${s.format==='Очно'?accent.ink:'#8A93A0'}; cursor:pointer;">🤝 Очно</button>
        </div>
        <div style="padding-top:0;">
          ${s.format!=='Очно'?`<div class="field"><span>🎥</span><input type="text" placeholder="ссылка на звонок (Зум / Телемост)" value="${esc(s.callLink)}" onchange="updateStudent('${s.id}',{callLink:this.value})"><button class="iconbtn" onclick="copyText('${esc(s.callLink)}', this)">⧉</button></div>`:''}
          ${s.format!=='Очно'?`<div class="field"><span>✏️</span><input type="text" placeholder="ссылка на доску" value="${esc(s.boardLink)}" onchange="updateStudent('${s.id}',{boardLink:this.value})"><button class="iconbtn" onclick="copyText('${esc(s.boardLink)}', this)">⧉</button></div>`:''}
          <div class="filelabel" style="margin-top:0.5rem;">Ссылки на чат</div>
          ${(() => {
            const g = groupMessengers(s.messengers);
            const row = m => `

let matMode = 'link';
let friendMaterials = []; // populated by module script listener
let matCategory = 'discuss';
function setMatCategory(cat){ matCategory = cat; render(); }
let selectedMatFile = null;
const ALLOWED_EXT = ['pdf','doc','docx','xls','xlsx','csv','ppt','pptx','png','jpg','jpeg','gif','webp','txt','zip','rar','py'];
const VIDEO_EXT = ['mp4','mov','avi','webm','mkv'];
const MAX_FILE_SIZE = 20*1024*1024; // 20 МБ, совпадает с upload.php

function setMatMode(mode){
  matMode = mode;
  selectedMatFile = null;
  render();
}

function onMatFileSelected(){
  const input = document.getElementById('matFile');
  const infoEl = document.getElementById('matFileInfo');
  const file = input.files[0];
  if(!file){ selectedMatFile = null; if(infoEl) infoEl.textContent = 'Файл не выбран'; return; }
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if(VIDEO_EXT.includes(ext)){
    showToast('Видео сюда не грузим — переключись на «Ссылка» и вставь ссылку на YouTube/облако');
    input.value = ''; selectedMatFile = null; if(infoEl) infoEl.textContent = 'Файл не выбран';
    return;
  }
  if(!ALLOWED_EXT.includes(ext)){
    showToast('Такой тип файла нельзя загрузить: .' + ext);
    input.value = ''; selectedMatFile = null; if(infoEl) infoEl.textContent = 'Файл не выбран';
    return;
  }
  if(file.size > MAX_FILE_SIZE){
    showToast('Файл слишком большой — максимум 20 МБ');
    input.value = ''; selectedMatFile = null; if(infoEl) infoEl.textContent = 'Файл не выбран';
    return;
  }
  selectedMatFile = file;
  if(infoEl) infoEl.textContent = `${file.name} · ${(file.size/1024/1024).toFixed(1)} МБ`;
  const nameEl = document.getElementById('matName');
  if(nameEl && !nameEl.value.trim()){
    nameEl.value = file.name.replace(/\.[^.]+$/, '');
  }
}

async function addMaterial(){
  const name = document.getElementById('matName').value.trim();
  if(!materialPicker.visibleToAll && materialPicker.studentIds.length===0){
    showToast('Выбери, кому виден материал — «Все ученики» или хотя бы одного конкретного');
    return;
  }
  const visibleToFriends = document.getElementById('matVisibleToFriends').checked;

  if(matMode === 'upload'){
    if(!selectedMatFile){ showToast('Выбери файл для загрузки'); return; }
    if(!window.__fbUploadMaterialFile){ showToast('Загрузка сейчас недоступна, попробуй позже'); return; }
    showToast('Загружаю файл…', 'info', 15000);
    try{
      const result = await window.__fbUploadMaterialFile(selectedMatFile);
      const material = {
        id: uid(), name: name || selectedMatFile.name, url: result.url,
        storage: 'timeweb', fileName: result.fileName, fileOwnerUid: window.__currentUid, category: matCategory,
        visibleToAll: materialPicker.visibleToAll, studentIds: materialPicker.visibleToAll ? [] : [...materialPicker.studentIds],
        visibleToFriends
      };
      data.materials = [...(data.materials||[]), material];
      if(window.__fbUpsertMaterial) window.__fbUpsertMaterial(material);
      document.getElementById('matName').value = '';
      selectedMatFile = null;
      materialPicker = { visibleToAll:false, studentIds:[] };
      try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
      showToast('Файл загружен и добавлен!', 'success', 3000);
      render();
    }catch(e){

// custom install button — more reliable than waiting for the browser to surface its own prompt
let deferredInstallPrompt = null;

const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
window.addEventListener('beforeinstallprompt', (e) => {

});

<script type="module">

      const legacyRef = doc(db, 'users', uid, 'appdata', 'main');
      const legacySnap = await getDoc(legacyRef);
      if (!legacySnap.exists()) return;
      const legacy = migrate(legacySnap.data());
      for (const s of (legacy.students || [])) {
        await setDoc(doc(db, 'users', uid, 'students', s.id), s);
      }
      await setDoc(doc(db, 'users', uid, 'appdata', 'meta'), { openIds: legacy.openIds || [] });
      // migrate old shared/per-student files into the new unified materials catalog
      for (const f of (legacy.sharedFiles || [])) {
        await setDoc(doc(db, 'users', uid, 'materials', f.id || cryptoRandomId()), {
          id: f.id, name: f.name || '', url: f.url, visibleToAll: true, studentIds: []
        });
      }
      for (const s of (legacy.students || [])) {
        for (const f of (s.files || [])) {
          await setDoc(doc(db, 'users', uid, 'materials', f.id || cryptoRandomId()), {
            id: f.id, name: f.name || '', url: f.url, visibleToAll: false, studentIds: [s.id]
          });
        }
      }
      await deleteDoc(legacyRef);
    } catch (e) { console.error('legacy migration failed', e); }
  }
  function cryptoRandomId(){ return Math.random().toString(36).slice(2,9); }

  let subscribedThemeIds = new Set();
  function subscribeStudentThemes(uid, students){
    students.forEach(s => {
      if (subscribedThemeIds.has(s.id)) return;
      subscribedThemeIds.add(s.id);
      onSnapshot(doc(db, 'users', uid, 'students', s.id, 'prefs', 'theme'), (snap) => {
        studentThemes[s.id] = snap.exists() ? (snap.data().theme || 'classic') : 'classic';
        render();
      }, () => {});
    });
  }

  function startTutorSync(uid) {
    let studentsLoaded = false, metaLoaded = false, materialsLoaded = false;
    let latestMaterials = [];
    const tryRender = () => {
      if (!studentsLoaded || !metaLoaded || !materialsLoaded) return;
      data = { students: latestStudents, materials: latestMaterials, openIds: latestMeta.openIds, theme: latestMeta.theme, sharedFiles: [] };
      knownStudentIds = new Set(latestStudents.map(s => s.id));
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('appRoot').style.display = 'block';
      subscribeStudentThemes(uid, latestStudents);
      render();
    };
    unsubStudents = onSnapshot(collection(db, 'users', uid, 'students'), (snap) => {
      latestStudents = snap.docs.map(d => migrateStudent(d.data()));
      studentsLoaded = true;
      tryRender();
    }, (err) => console.error('students sync error', err));
    unsubMeta = onSnapshot(doc(db, 'users', uid, 'appdata', 'meta'), (snap) => {
      latestMeta = snap.exists() ? snap.data() : { openIds: [] };
      if (latestMeta.friendCode) friendCode = latestMeta.friendCode;
      metaLoaded = true;
      tryRender();
    }, (err) => console.error('meta sync error', err));
    onSnapshot(collection(db, 'users', uid, 'materials'), (snap) => {
      latestMaterials = snap.docs.map(d => d.data());
      materialsLoaded = true;
      tryRender();
    }, (err) => console.error('materials sync error', err));
    onSnapshot(doc(db, 'users', uid, 'appdata', 'profile'), (snap) => {
      if (snap.exists() && window.loadProfileIntoForm) window.loadProfileIntoForm(snap.data());
    }, (err) => console.error('profile sync error', err));
    startFriendsSync(uid);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('../index.html'); return; }
    currentUid = user.uid;
    window.__currentUid = user.uid;
    const accessSnap = await getDoc(doc(db, 'studentAccess', user.uid));
    if (accessSnap.exists()) { window.location.replace('student.html'); return; }
    await migrateLegacyIfNeeded(user.uid);
    startTutorSync(user.uid);
  });
</script>
