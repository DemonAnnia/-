<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Кабинет репетитора</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1F2A3D">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div id="loadingScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; color:#8A93A0; font-family:'IBM Plex Sans',sans-serif; font-size:0.875rem;">Загружаю…</div>

<div id="backdrop" class="backdrop" onclick="closeDrawer()" aria-hidden="true"></div>
<div id="drawer" class="drawer" role="navigation" aria-label="Главное меню">
  <div class="drawer-title">📘 Меню</div>

  <button class="drawer-item" onclick="showOverviewView()">🏠 Обзор</button>
  <button class="drawer-item" onclick="showStudentsView()">👥 Все ученики</button>
  <button class="drawer-item" onclick="openAddStudentSheet()">➕ Добавить ученика</button>

  <hr class="drawer-hr">
  <button class="drawer-item" onclick="showCalendarView()">📅 Календарь</button>
  <button class="drawer-item" onclick="showIssuesView()">⚠️ Нерешённые вопросы <span id="issuesBadge" style="display:none; margin-left:auto; font-size:0.6875rem; background:#C0392B; color:#fff; padding:0.1rem 0.4rem; border-radius:999px;"></span></button>
  <button class="drawer-item" onclick="showMaterialsView()">📚 Материалы</button>
  <button class="drawer-item" style="color:#B7BEC7; cursor:default;" onclick="showToast('Тренажёры — в работе, скоро будут.', 'info', 4000)">🧠 Тренажёры <span style="margin-left:auto; font-size:0.6875rem; background:#F1F3F5; color:#8A93A0; padding:0.1rem 0.4rem; border-radius:999px;">скоро</span></button>
  <button id="archiveMenuItem" class="drawer-item" style="display:none;" onclick="showArchiveView()">🗄 Архив</button>

  <hr class="drawer-hr">
  <button class="drawer-item" onclick="showFriendsView()">🤝 Друзья</button>
  <button class="drawer-item" onclick="showNotificationsView()">🔔 Уведомления <span id="notifBadge" style="display:none; margin-left:auto; font-size:0.6875rem; background:#C0392B; color:#fff; padding:0.1rem 0.4rem; border-radius:999px;"></span></button>
  <button class="drawer-item" onclick="showSettingsView()">⚙️ Настройки</button>
  <input id="restoreFile" type="file" accept="application/json" style="display:none;" onchange="restoreBackup(this)">

  <hr class="drawer-hr">
  <button id="installBtnDrawer" class="drawer-item" style="display:none;">📲 Установить приложение</button>
  <button class="drawer-item" onclick="doLogout()" style="color:#C0392B;">🚪 Выйти</button>
</div>

<div id="appRoot" style="display:none;">
<div class="wrap">
  <div style="display:flex; align-items:center; gap:0.625rem; margin-bottom:0.25rem;">
    <button class="hamburger" onclick="openDrawer()" aria-label="Открыть меню">☰</button>
    <h1 id="pageTitle" style="margin:0;">📘 Перед уроком</h1>
  </div>
  <div id="pageSub" class="sub" style="margin-top:0.375rem;">Ссылки, доски и материалы — по каждому ученику. Синхронизируется на всех устройствах.</div>
  <div id="mainArea" role="main"></div>
  <div id="onboardingSheetContainer"></div>
</div>
</div>

<script src="tutor/shared.js"></script>
<script src="calendar.js"></script>
<script src="tutor/scheduleUI.js"></script>
<script src="tutor/issues.js"></script>
<script src="tutor/notifications.js"></script>
<script src="tutor/students.js"></script>
<script src="tutor/materials.js"></script>
<script src="tutor/friends.js"></script>
<script src="tutor/settings.js"></script>
<script src="tutor/navigation.js"></script>
<script type="module" src="tutor/firebase.js"></script>
</body>
</html>
