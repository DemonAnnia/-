<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Кабинет репетитора</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A3D">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="loadingScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; color:#8A93A0; font-family:'IBM Plex Sans',sans-serif; font-size:0.875rem;">Загружаю…</div>
<div id="loginGate" style="min-height:100vh; display:none; align-items:center; justify-content:center; padding:1.5rem;">
  <div style="width:100%; max-width:22rem; background:#fff; border-radius:0.875rem; padding:1.5rem; box-shadow:0 1px 2px rgba(31,42,61,0.08);">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.25rem; margin-bottom:0.25rem;">📘 Вход в кабинет</div>
    <div style="font-size:0.8125rem; color:#5A6472; margin-bottom:1rem;">Свой логин и пароль — только для тебя</div>
    <input id="loginEmail" type="text" placeholder="логин (или email)" style="width:100%; font-size:0.875rem; padding:0.625rem 0.75rem; border-radius:0.5rem; border:1px solid #C9D2DB; margin-bottom:0.5rem;">
    <input id="loginPassword" type="password" placeholder="пароль" style="width:100%; font-size:0.875rem; padding:0.625rem 0.75rem; border-radius:0.5rem; border:1px solid #C9D2DB; margin-bottom:0.5rem;">
    <input id="loginInviteCode" type="text" placeholder="код приглашения (только для ученика)" style="width:100%; font-size:0.875rem; padding:0.625rem 0.75rem; border-radius:0.5rem; border:1px solid #C9D2DB; margin-bottom:0.75rem; text-transform:uppercase;">
    <div id="loginError" style="font-size:0.78125rem; color:#C0392B; margin-bottom:0.5rem;"></div>
    <button onclick="doLogin()" style="width:100%; padding:0.625rem 0; border-radius:0.625rem; border:none; background:#1F2A3D; color:#fff; font-weight:600; font-size:0.875rem; margin-bottom:0.5rem; cursor:pointer;">Войти</button>
    <button onclick="doSignup()" style="width:100%; padding:0.625rem 0; border-radius:0.625rem; border:1px solid #C9D2DB; background:#fff; color:#5A6472; font-weight:600; font-size:0.875rem; cursor:pointer;">Создать аккаунт (первый раз)</button>
    <div style="font-size:0.71875rem; color:#9BA3AE; margin-top:0.625rem;">Если ты ученик — впиши код приглашения от преподавателя перед созданием аккаунта. Если ты Аня — оставь это поле пустым.</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, runTransaction, enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./assets/firebase-config.js";

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  try { await enableIndexedDbPersistence(db); } catch (e) {}

  async function claimInviteCode(code, uid) {
    const linkRef = doc(db, 'studentLinks', code);
    await runTransaction(db, async (tx) => {
      const linkSnap = await tx.get(linkRef);
      if (!linkSnap.exists() || linkSnap.data().claimed) {
        throw new Error('код недействителен или уже использован');
      }
      const { tutorUid, studentId } = linkSnap.data();
      tx.update(linkRef, { claimed: true, claimedBy: uid });
      tx.set(doc(db, 'studentAccess', uid), { tutorUid, studentId });
    });
  }

  async function goToRightPlace(user) {
    const accessSnap = await getDoc(doc(db, 'studentAccess', user.uid));
    window.location.replace(accessSnap.exists() ? 'app/student.html' : 'app/tutor.html');
  }

  function loginToEmail(login) {
    const trimmed = login.trim().toLowerCase();
    if (trimmed.includes('@')) return trimmed; // already a real email (e.g. Аня's existing account) — use as-is
    const clean = trimmed.replace(/[^a-z0-9._-]/g, '');
    return clean + '@kabinet-repetitora.local';
  }

  window.doLogin = async function () {
    const email = loginToEmail(document.getElementById('loginEmail').value);
    const pass = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      errEl.textContent = 'Не получилось войти: ' + (e.code || e.message);
    }
  };

  window.doSignup = async function () {
    const rawLogin = document.getElementById('loginEmail').value.trim();
    const email = loginToEmail(rawLogin);
    const pass = document.getElementById('loginPassword').value;
    const code = document.getElementById('loginInviteCode').value.trim().toUpperCase();
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    if (!rawLogin) { errEl.textContent = 'Впиши логин'; return; }
    if (pass.length < 6) { errEl.textContent = 'Пароль должен быть не короче 6 символов'; return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      if (code) {
        try {
          await claimInviteCode(code, cred.user.uid);
        } catch (e) {
          errEl.textContent = 'Аккаунт создан, но код не сработал: ' + (e.message || e.code) + '. Попроси у преподавателя новый код.';
          return;
        }
      }
      await goToRightPlace(cred.user);
    } catch (e) {
      errEl.textContent = 'Не получилось создать аккаунт: ' + (e.code || e.message);
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      await goToRightPlace(user);
    } else {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('loginGate').style.display = 'flex';
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
</script>
</body>
</html>
